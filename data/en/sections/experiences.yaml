        responsibilities:
          - Co‑founded AUB's Machine INtelligence Development (MIND) Lab https://sites.aub.edu.lb/mindlab
          - My research focused on state‑of‑the‑art NLP technologies for natural language processing, generation, and chatbots.
          - In early 2020 I developed AraBERT&#58; The first Arabic BERT. The model is now the most cited Arabic AI paper, and most starred Arabic Github Repository. It had reach 10M+ downloads on Hugginface with 500K+ downloads in the last month. I introduced a Arabic specific tokenization technique which adds morphological segmentation prior to WordPiece tokenization.
